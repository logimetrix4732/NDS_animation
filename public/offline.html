<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Offline - NDDB</title>
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }

      body {
        font-family: "Segoe UI", Tahoma, Geneva, Verdana, sans-serif;
        background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        color: white;
      }

      .offline-container {
        text-align: center;
        max-width: 500px;
        padding: 40px 20px;
        background: rgba(255, 255, 255, 0.1);
        border-radius: 20px;
        backdrop-filter: blur(10px);
        border: 1px solid rgba(255, 255, 255, 0.2);
        box-shadow: 0 8px 32px rgba(0, 0, 0, 0.1);
      }

      .offline-icon {
        font-size: 80px;
        margin-bottom: 20px;
        opacity: 0.8;
      }

      h1 {
        font-size: 2.5rem;
        margin-bottom: 15px;
        font-weight: 300;
      }

      p {
        font-size: 1.1rem;
        margin-bottom: 30px;
        opacity: 0.9;
        line-height: 1.6;
      }

      .retry-btn {
        background: rgba(255, 255, 255, 0.2);
        border: 2px solid rgba(255, 255, 255, 0.3);
        color: white;
        padding: 12px 30px;
        border-radius: 50px;
        font-size: 1rem;
        cursor: pointer;
        transition: all 0.3s ease;
        text-decoration: none;
        display: inline-block;
      }

      .retry-btn:hover {
        background: rgba(255, 255, 255, 0.3);
        border-color: rgba(255, 255, 255, 0.5);
        transform: translateY(-2px);
      }

      .features {
        margin-top: 40px;
        text-align: left;
      }

      .feature {
        display: flex;
        align-items: center;
        margin-bottom: 15px;
        font-size: 0.9rem;
        opacity: 0.8;
      }

      .feature-icon {
        margin-right: 10px;
        font-size: 1.2rem;
      }

      @media (max-width: 600px) {
        .offline-container {
          margin: 20px;
          padding: 30px 15px;
        }

        h1 {
          font-size: 2rem;
        }

        .offline-icon {
          font-size: 60px;
        }
      }
    </style>
  </head>
  <body>
    <div class="offline-container">
      <div class="offline-icon">📡</div>
      <h1>You're Offline</h1>
      <p>
        Aapka internet connection nahi hai. Kuch cached content available hai,
        lekin naye data ke liye internet connection chahiye.
      </p>

      <a href="/" class="retry-btn" onclick="window.location.reload()">
        Retry Connection
      </a>

      <div class="features">
        <div class="feature">
          <span class="feature-icon">✅</span>
          <span>Cached images aur videos available hain</span>
        </div>
        <div class="feature">
          <span class="feature-icon">✅</span>
          <span>Basic website functionality available hai</span>
        </div>
        <div class="feature">
          <span class="feature-icon">⚠️</span>
          <span>Naye data ke liye internet chahiye</span>
        </div>
      </div>
    </div>

    <script>
      // Check for online status
      function updateOnlineStatus() {
        if (navigator.onLine) {
          // If online, redirect to home page
          window.location.href = "/";
        }
      }

      // Listen for online event
      window.addEventListener("online", updateOnlineStatus);

      // Check status every 5 seconds
      setInterval(updateOnlineStatus, 5000);

      // Service worker message handling
      if ("serviceWorker" in navigator) {
        navigator.serviceWorker.addEventListener("message", (event) => {
          if (event.data && event.data.type === "CACHE_UPDATED") {
            console.log("Cache updated, redirecting...");
            window.location.href = "/";
          }
        });
      }
    </script>
  </body>
</html>
